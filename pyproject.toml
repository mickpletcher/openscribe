[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openscribe"
version = "0.1.0"
description = "Open source CLI and TUI writing environment for long form projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mick" }]
dependencies = [
  "defusedxml>=0.7.1",
  "EbookLib>=0.18",
  "python-docx>=1.1.2",
  "pyyaml>=6.0.1",
  "reportlab>=4.4.1",
  "rich>=13.7.1",
  "textual>=0.61.1",
  "typer>=0.12.3",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8"]
packaging = [
  "PyInstaller>=6.16",
  "PySide6==6.10.3",
]
ai = [
  "anthropic>=0.57.1",
  "google-genai>=1.29.0",
  "mistralai>=1.9.3",
  "openai>=1.40.0",
]
dev = [
  "PySide6>=6.8",
  "pytest-qt>=4.4",
  "build>=1.3.0",
  "pytest>=8.4.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.13.0",
]

[project.scripts]
openscribe = "openscribe.cli:app"

[project.gui-scripts]
openscribe-desktop = "openscribe.desktop_launcher:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openscribe = ["word_addin/*.html", "word_addin/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "UP", "RUF"]
ignore = ["B008"]
