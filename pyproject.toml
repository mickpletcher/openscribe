[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openscribe"
version = "0.1.0"
description = "Open source CLI and TUI writing environment for long form projects"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mick" }]
dependencies = [
  "EbookLib>=0.18",
  "python-docx>=1.1.2",
  "pyyaml>=6.0.1",
  "reportlab>=4.4.1",
  "rich>=13.7.1",
  "textual>=0.61.1",
  "typer>=0.12.3",
]

[project.optional-dependencies]
ai = [
  "anthropic>=0.57.1",
  "google-genai>=1.29.0",
  "mistralai>=1.9.3",
  "openai>=1.40.0",
]

[project.scripts]
openscribe = "openscribe.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
