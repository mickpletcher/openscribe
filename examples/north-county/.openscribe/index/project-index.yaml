  path: manuscript\part-01-opening\ch-02-the-call.md
  search_text: 'The Call A short phone call confirms that Eli is not in town by accident.
    Push the threat harder in the second half of the scene. ## Feed Store

    <!-- openscribe-scene-id: scene-4e7543ea41a34f279690f1d9a002f805 -->


    The pay phone outside the feed store still worked if you hit the side panel first.


    Eli dialed the number from memory.

    He expected voicemail.

    Instead, someone answered on the second ring and said his name before he spoke.


    ## The Warning

    <!-- openscribe-scene-id: scene-528dc769ec64447c82ec5a9bca12bce2 -->


    "You made good time," the voice said.


    Eli looked over his shoulder at the empty street.

    "Who is this?"


    "The only person in this county trying to keep you alive."


    The line went dead.'
