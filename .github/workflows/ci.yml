name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=openscribe --cov-report=term-missing --cov-fail-under=80
      - run: python -m openscribe --help
      - run: python -m openscribe desktop --help
      - run: python -m openscribe word --help

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --test tests/word_addin.test.cjs

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - name: Smoke test wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1
          python -m pip install --force-reinstall $wheel.FullName
          openscribe --help
          openscribe word --help
          python -c "from importlib.resources import files; assert files('openscribe').joinpath('word_addin/taskpane.js').is_file()"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[ai]" pip-audit bandit detect-secrets
      - run: pip-audit
      - run: bandit -r src -q -ll
      - run: python scripts/check-secrets.py

  documentation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: pwsh -File scripts/docs-check.ps1 -FailOnGap
